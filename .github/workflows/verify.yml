name: Verify

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: verify-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set Up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: npm

            - name: Set Up Java
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Verify Slick dependency pin
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync } from "node:fs";
                  const pkg = JSON.parse(readFileSync("package.json", "utf8"));
                  const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
                  const dependency = pkg.dependencies?.["slick2d-ts"];
                  if (typeof dependency !== "string" || !/^https:\/\/codeload\.github\.com\/meatfighter\/slick2d-ts\/tar\.gz\/[0-9a-f]{40}$/.test(dependency)) {
                      throw new Error(`package.json Slick dependency must be an immutable HTTPS commit archive: ${dependency}`);
                  }
                  if (lock.packages?.[""]?.dependencies?.["slick2d-ts"] !== dependency) {
                      throw new Error("package-lock.json root Slick dependency does not match package.json.");
                  }
                  if (lock.packages?.["node_modules/slick2d-ts"]?.resolved !== dependency) {
                      throw new Error("package-lock.json Slick resolution does not match the immutable package.json pin.");
                  }
                  NODE

            - name: Install Dependencies
              run: npm ci --ignore-scripts

            - name: Dependency Audit
              run: npm run verify:dependencies

            - name: Format
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Synthetic Release Build
              env:
                  MSPACMAN_HMAC_KEY_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
              run: node scripts/build-release.mjs --target=full --key-source=env

            - name: Browser Verification
              run: npm run verify:browser

            - name: Offline PWA Verification
              env:
                  MSPACMAN_VERIFY_PWA_ROOT: .release-components/synthetic-full/pwa
              run: npm run verify:offline

            - name: Install browser qualification engines
              run: npx playwright install --with-deps chromium firefox webkit

            - name: Qualify production browser lifecycle
              env:
                  PWA_ROOT: .release-components/synthetic-full/pwa
              run: xvfb-run --auto-servernum npm run verify:production-browser

            - name: Archive qualified build
              run: node scripts/archive-release.mjs .release-components/synthetic-full "$RUNNER_TEMP/qualified-artifacts"

            - name: Retain build and checksums
              uses: actions/upload-artifact@v7
              with:
                  name: qualified-${{ github.sha }}
                  path: ${{ runner.temp }}/qualified-artifacts
                  retention-days: 90
                  if-no-files-found: error
