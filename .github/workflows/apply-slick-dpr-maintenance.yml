name: Apply Slick and DPR maintenance

on:
    push:
        paths:
            - ".github/workflows/apply-slick-dpr-maintenance.yml"

permissions:
    contents: write

jobs:
    apply:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Apply maintenance
              shell: bash
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync, writeFileSync } from "node:fs";

                  function replaceExactlyOnce(path, oldText, newText) {
                      const before = readFileSync(path, "utf8");
                      const matches = before.split(oldText).length - 1;
                      if (matches !== 1) {
                          throw new Error(`${path}: expected exactly one match for ${JSON.stringify(oldText)}, found ${matches}.`);
                      }
                      writeFileSync(path, before.replace(oldText, newText));
                  }

                  const dependency13 = "git+https://github.com/meatfighter/slick2d-ts.git#semver:^1.3.1";
                  const dependency15 = "git+https://github.com/meatfighter/slick2d-ts.git#semver:^1.5.2";

                  replaceExactlyOnce("pwa/src/app/main.ts", "const MAX_DEVICE_PIXEL_RATIO = 2;", "const MAX_DEVICE_PIXEL_RATIO = 4;");
                  replaceExactlyOnce("package.json", dependency13, dependency15);

                  const lockPath = "package-lock.json";
                  const lock = JSON.parse(readFileSync(lockPath, "utf8"));
                  if (lock.packages?.[""]?.dependencies?.["slick2d-ts"] !== dependency13) {
                      throw new Error("package-lock.json root Slick dependency is not the expected 1.3.1 baseline.");
                  }
                  const lockedSlick = lock.packages?.["node_modules/slick2d-ts"];
                  if (lockedSlick?.version !== "1.3.1") {
                      throw new Error(`package-lock.json Slick version is not the expected 1.3.1 baseline: ${lockedSlick?.version}`);
                  }
                  lock.packages[""].dependencies["slick2d-ts"] = dependency15;
                  lockedSlick.version = "1.5.2";
                  lockedSlick.resolved = "git+https://github.com/meatfighter/slick2d-ts.git#7985ae395f5972998f5985e51ce8a6c65664b348";
                  writeFileSync(lockPath, `${JSON.stringify(lock, null, 4)}\n`);
                  NODE

            - name: Commit maintenance
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git rm .github/workflows/apply-slick-dpr-maintenance.yml
                  git add pwa/src/app/main.ts package.json package-lock.json
                  git diff --cached --check
                  git commit -m "Update Slick baseline and DPR presentation"
                  git push
