name: Refresh Slick lock

on:
  push:
    paths:
      - ".github/workflows/refresh-slick-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Validate canonical Slick lock metadata
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = pkg.dependencies['slick2d-ts'];
          const root = lock.packages[''].dependencies['slick2d-ts'];
          const resolved = lock.packages['node_modules/slick2d-ts'].resolved;
          if (root !== expected || resolved !== expected) {
            throw new Error(`Unexpected Slick lock metadata: expected ${expected}, root=${root}, resolved=${resolved}`);
          }
          EOF
      - name: Commit refreshed lock and remove helper
        run: |
          rm .github/workflows/refresh-slick-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-slick-lock.yml
          git diff --cached --check
          git commit -m "Refresh slick2d-ts lock metadata"
          git push
