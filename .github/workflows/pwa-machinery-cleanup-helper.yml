name: PWA Machinery Cleanup Helper

on:
  push:
    branches:
      - chatgpt/pwa-machinery-hardening-20260905
    paths:
      - .github/workflows/pwa-machinery-cleanup-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/pwa-machinery-hardening-20260905
      - name: Extend temporary Git fixture cleanup tolerance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-release-safety.mjs')
          text = path.read_text()
          old = '''        maxRetries: 10,\n        recursive: true,\n        retryDelay: 100\n'''
          new = '''        maxRetries: 30,\n        recursive: true,\n        retryDelay: 100\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one cleanup retry block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit cleanup hardening
        run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add scripts/test-release-safety.mjs
          git commit -m "Harden release test fixture cleanup"
          git push origin HEAD:chatgpt/pwa-machinery-hardening-20260905
