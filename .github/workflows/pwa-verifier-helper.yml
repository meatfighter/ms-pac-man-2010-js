name: PWA Verifier Helper

on:
  push:
    branches:
      - chatgpt/pwa-machinery-hardening-20260905
    paths:
      - .github/workflows/pwa-verifier-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/pwa-machinery-hardening-20260905
      - name: Update service-worker verifier for HTTP-aware fetch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-pwa-build.mjs')
          text = path.read_text()
          old = '''    assert.ok(\n        serviceWorker.includes("fetch(request).catch(() => matchCurrentCache(APP_INDEX))"),\n        "Navigation fallback must fetch first and fall back to cached APP_INDEX without replacing APP_INDEX."\n    );\n    assert.ok(\n        serviceWorker.includes("return cached || fetch(request);"),\n        "Non-navigation requests must return current-cache hits directly and fetch uncached requests without overwriting precached assets."\n    );\n'''
          new = '''    assert.ok(\n        serviceWorker.includes("fetchOnce(request).catch(() => matchCurrentCache(APP_INDEX))"),\n        "Navigation fallback must use the HTTP-aware network fetch first and fall back to cached APP_INDEX without replacing APP_INDEX."\n    );\n    assert.ok(\n        serviceWorker.includes("return cached || fetchOnce(request);"),\n        "Non-navigation requests must return current-cache hits directly and use the HTTP-aware fetch for uncached requests without overwriting precached assets."\n    );\n    assert.ok(serviceWorker.includes("if (!response.ok)"), "Service-worker network fetches must reject HTTP error responses before fallback handling.");\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one immutable-cache assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit verifier update
        run: |
          git config user.name "zeroone"
          git config user.email "54445200+meatfighter@users.noreply.github.com"
          git add scripts/verify-pwa-build.mjs
          git commit -m "Verify HTTP-aware service-worker fallback"
          git push origin HEAD:chatgpt/pwa-machinery-hardening-20260905
