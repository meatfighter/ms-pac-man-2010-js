<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="__DESCRIPTION__" />
        <meta name="application-name" content="Ms. Pac-Man 2010" />
        <meta name="ms-pac-man-2010:version" content="__APP_VERSION__" />
        <meta name="ms-pac-man-2010:build-stamp" content="__BUILD_STAMP__" />
        <link rel="canonical" href="__CANONICAL_URL__" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="meatfighter.com" />
        <meta property="og:title" content="Ms. Pac-Man 2010" />
        <meta property="og:description" content="__DESCRIPTION__" />
        <meta property="og:url" content="__CANONICAL_URL__" />
        <meta property="og:image" content="__SOCIAL_IMAGE_URL__" />

        <meta name="twitter:title" content="Ms. Pac-Man 2010" />
        <meta name="twitter:description" content="__DESCRIPTION__" />
        <meta name="twitter:image" content="__SOCIAL_IMAGE_URL__" />
        <link
            rel="preload"
            href="./assets/fonts/source-sans-3/SourceSans3VF-Upright.ttf.woff2?v=__BUILD_STAMP_ENCODED__"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="./styles.css?v=__BUILD_STAMP_ENCODED__" />
        <link rel="icon" href="./assets/favicon.svg?v=__BUILD_STAMP_ENCODED__" type="image/svg+xml" />
        <link rel="icon" href="./assets/favicon-32.png?v=__BUILD_STAMP_ENCODED__" type="image/png" sizes="32x32" />
        <link rel="icon" href="./assets/favicon-16.png?v=__BUILD_STAMP_ENCODED__" type="image/png" sizes="16x16" />
        <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=__BUILD_STAMP_ENCODED__" sizes="180x180" />
        <title>Ms. Pac-Man 2010</title>
        <script>
            (() => {
                try {
                    const theme = localStorage.getItem("ms-pac-man-2010-about-theme");
                    if (theme === "dark" || theme === "light") {
                        document.documentElement.dataset.theme = theme;
                    }
                } catch {
                    // Keep the default theme when storage is unavailable.
                }
            })();
        </script>
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <div class="site-header__inner">
                    <h1 class="site-title">
                        <a class="site-logo-link" href="./" aria-label="Ms. Pac-Man 2010">
                            <picture class="site-logo-picture">
                                <source type="image/webp" srcset="./__TITLE_WEBP_SRCSET__" sizes="__TITLE_IMAGE_SIZES__" />
                                <img
                                    class="site-logo"
                                    src="./__TITLE_PNG_SRC__"
                                    srcset="./__TITLE_PNG_SRCSET__"
                                    sizes="__TITLE_IMAGE_SIZES__"
                                    alt="Ms. Pac-Man 2010"
                                    width="__TITLE_IMAGE_WIDTH__"
                                    height="__TITLE_IMAGE_HEIGHT__"
                                    decoding="async"
                                />
                            </picture>
                        </a>
                    </h1>
                    <label class="theme-switch" for="theme-toggle">
                        <span class="sr-only">Toggle dark mode</span>
                        <input id="theme-toggle" type="checkbox" role="switch" aria-label="Toggle dark mode" />
                        <span class="theme-switch__track" aria-hidden="true"></span>
                    </label>
                </div>
            </header>

            <main id="main" class="site-main">
                __TOC_HTML__
                <article class="article" aria-label="About Ms. Pac-Man 2010">__ARTICLE_HTML__</article>
            </main>

            <footer class="site-footer">
                <div class="site-footer__inner">
                    <div class="site-footer__left">
                        <p>&copy; 2026 meatfighter.com</p>
                        <p>
                            This content is licensed under
                            <span class="license-wrap">
                                <a
                                    class="license-link"
                                    href="https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1"
                                    target="_blank"
                                    rel="license noopener noreferrer"
                                    >CC BY-SA 4.0</a
                                >
                                <a
                                    class="license-icons"
                                    href="https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1"
                                    target="_blank"
                                    rel="license noopener noreferrer"
                                    aria-label="Creative Commons Attribution ShareAlike 4.0"
                                >
                                    <img
                                        src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1"
                                        alt="Creative Commons icon"
                                        width="18"
                                        height="18"
                                    />
                                    <img
                                        src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1"
                                        alt="Attribution icon"
                                        width="18"
                                        height="18"
                                    />
                                    <img
                                        src="https://mirrors.creativecommons.org/presskit/icons/sa.svg?ref=chooser-v1"
                                        alt="ShareAlike icon"
                                        width="18"
                                        height="18"
                                    />
                                </a>
                            </span>
                        </p>
                    </div>
                    <div class="site-footer__links">
                        <a href="__REPOSITORY_URL__" target="_blank" rel="noopener noreferrer">Source</a>
                        <span class="site-footer__separator" aria-hidden="true">|</span>
                        <a href="https://meatfighter.com/">Home</a>
                    </div>
                </div>
            </footer>
        </div>

        <script src="./theme.js?v=__BUILD_STAMP_ENCODED__"></script>

</html>
